<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stretchable Strips Template</title>
  <style>
    /* Base strip styles - can be customized */
    .strip-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .strip-row {
      display: flex;
      flex: 1;
      min-height: 0; /* Important for flex stretching */
      width: 100%;
    }

    .strip-column {
      flex: 1;
      min-width: 0; /* Important for flex stretching */
      height: 100%;
    }

    /* Stretchable content areas */
    .stretchable-content {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: auto;
    }

    /* Example: Full-width header strip */
    .header-strip {
      background: #f8f9fa;
      padding: 1rem;
      border-bottom: 1px solid #e9ecef;
      flex-shrink: 0; /* Prevents shrinking */
    }

    /* Example: Content strip with flexible columns */
    .content-strip {
      display: flex;
      gap: 1rem;
      padding: 1rem;
    }

    .content-main {
      flex: 2;
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 0.25rem;
    }

    .content-sidebar {
      flex: 1;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 0.25rem;
    }

    /* Example: Footer strip */
    .footer-strip {
      background: #343a40;
      color: white;
      padding: 1rem;
      text-align: center;
      flex-shrink: 0;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .content-strip {
        flex-direction: column;
      }
      
      .content-main,
      .content-sidebar {
        flex: 1;
      }
    }

    /* Stretchable grid layout */
    .stretchable-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .grid-item {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 0.25rem;
      padding: 1rem;
      min-height: 150px;
    }

    /* Full-height stretchable section */
    .full-height-strip {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .full-height-content {
      flex: 1;
      overflow: auto;
      padding: 1rem;
    }

    /* Customizable strip classes */
    .strip-primary {
      background: #007bff;
      color: white;
    }

    .strip-secondary {
      background: #6c757d;
      color: white;
    }

    .strip-success {
      background: #28a745;
      color: white;
    }

    .strip-danger {
      background: #dc3545;
      color: white;
    }

    .strip-warning {
      background: #ffc107;
      color: #212529;
    }

    .strip-info {
      background: #17a2b8;
      color: white;
    }

    .strip-light {
      background: #f8f9fa;
      color: #212529;
    }

    .strip-dark {
      background: #343a40;
      color: white;
    }
  </style>
</head>
<body>
  <div class="strip-container">
    <!-- Header Strip -->
    <div class="header-strip">
      <h1>Website Header</h1>
    </div>
    
    <!-- Content Strip with Flexible Columns -->
    <div class="content-strip">
      <div class="content-main stretchable-content">
        <h2>Main Content</h2>
        <p>This content will stretch and resize with the window.</p>
      </div>
      <div class="content-sidebar stretchable-content">
        <h3>Sidebar</h3>
        <p>Flexible sidebar that adapts to window size.</p>
      </div>
    </div>
    
    <!-- Full-height Content Strip -->
    <div class="full-height-strip">
      <div class="full-height-content stretchable-content">
        <h2>Full Height Content</h2>
        <p>This section will stretch to fill available vertical space.</p>
      </div>
    </div>
    
    <!-- Footer Strip -->
    <div class="footer-strip">
      <p>Website Footer</p>
    </div>
  </div>
</body>
</html>

name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "visionweave-v*"

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: "--bundles nsis,msi"
          - label: Linux x64
            platform: ubuntu-22.04
            rust_targets: ""
            args: "--bundles deb"
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - label: macOS Intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: visionweave-v__VERSION__
          releaseName: VisionWeave v__VERSION__
          releaseBody: |
            Download the installer for your operating system:
            - Windows: setup `.exe` or `.msi` (x64)
            - macOS: `.dmg` (Apple Silicon or Intel)
            - Linux: `.deb` (x64 Debian-based distributions)
          releaseDraft: false
          prerelease: false
